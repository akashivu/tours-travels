<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Elixway | AI Travel Intelligence</title>

    <meta
      name="description"
      content="Elixway brings AI-powered travel intelligence to one place. Plan smarter, compare and book flights, hotels and cabs with confidence."
    />

    <meta
      name="keywords"
      content="Elixway, AI travel intelligence, AI travel, flight booking, hotel booking, cab booking, travel planning, flight comparison, hotel comparison, cab comparison, travel platform"
    />

    <meta name="author" content="Elixway" />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#101828" />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://elixway.com/"
    />

    <!-- Favicons -->
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/favicon-96x96.png"
    />

    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <!-- Web App Manifest -->
    <link
      rel="manifest"
      href="/site.webmanifest"
    />

    <!-- Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Elixway"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <meta
      property="og:title"
      content="Elixway — AI Travel Intelligence"
    />

    <meta
      property="og:description"
      content="Compare, plan and book flights, hotels and cabs with Elixway's AI-powered travel intelligence."
    />

    <meta
      property="og:url"
      content="https://elixway.com/"
    />

    <meta
      property="og:image"
      content="https://elixway.com/image/elixway-share.jpg"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="Elixway — AI Travel Intelligence"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Elixway — AI Travel Intelligence"
    />

    <meta
      name="twitter:description"
      content="Compare, plan and book flights, hotels and cabs with Elixway."
    />

    <meta
      name="twitter:image"
      content="https://elixway.com/image/elixway-share.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="Elixway — AI Travel Intelligence"
    />

    <meta
      name="twitter:url"
      content="https://elixway.com/"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Elixway",
        "url": "https://elixway.com/",
        "description": "AI-powered travel intelligence platform for planning, comparing and booking flights, hotels and cabs.",
        "publisher": {
          "@type": "Organization",
          "name": "Elixway",
          "url": "https://elixway.com/"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>

    <!-- Google Maps -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA2cFuK7PcvkCnGBxbkKVstFb0vP1Ue6i4&libraries=places"
    ></script>

    <script
      type="module"
      src="https://unpkg.com/@googlemaps/extended-component-library@latest"
    ></script>
  </body>
</html>
